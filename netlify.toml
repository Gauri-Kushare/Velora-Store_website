# ==============================================================================
# Netlify Configuration - VELORA Atelier E-Commerce (Vite + React SPA)
# ==============================================================================

[build]
  # Build command to compile TypeScript and bundle with Vite
  command = "npm run build"
  # Production build output directory generated by Vite
  publish = "dist"

# Single-Page Application (SPA) redirect rule
# Ensures client-side routing (Shop, Product, Cart, Checkout, Account, Wishlist)
# resolves correctly to index.html without 404 errors on browser refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optimal Cache-Control headers for Vite static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
